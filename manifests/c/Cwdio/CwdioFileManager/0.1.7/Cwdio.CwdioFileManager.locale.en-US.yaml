ShortDescription: Keyboard-first dual-pane file manager with a terminal that follows the panel.
Description: |-
  cwdio is a keyboard-first, dual-pane file manager for Windows and Linux. Its embedded terminal follows
  the active panel, and typing cd moves the panel back, including over SSH. Transfers run through a
  journaled queue that survives a restart or a dropped drive, and delete goes to the OS trash by default.
  On Windows it also shares the OS file clipboard, so Ctrl+C here pastes in Explorer.
